function connect(){

function receive(m){

function act(p,kind){if(p.lock>0||p.hp<=0)return;p.action=kind;p.age=0;p.charge=0;p.attack=++attackSerial;p.landed=false;p.lock=kind==='heavy'?.85:(p.counter>0?.32:.46);p.counter=0;sfx(kind==='heavy'?'heavy':'swish');}

function burst(x,y,color,n){for(let i=0;i<n;i++)S.fx.push({x,y,vx:(Math.random()-.5)*120,vy:-20-Math.random()*90,life:.25+Math.random()*.3,max:.55,color,size:i%3?1:2});}

function interpolate(f){

function update(dt){
  S.clock+=dt;if(!S.online&&S.clock>=retryAt){retryAt=S.clock+4;connect();}

  if(S.scene==='waiting'&&S.online&&!S.queued&&S.clock>=S.queueAt){send({type:'queue'});S.queued=true;}
  if(configured&&S.queueUntil&&S.clock>S.queueUntil)startCPU();

    const f=S.fight;if(!f)return;
    const paused=f.cpu&&f.phase==='active'&&(!S.focused||document.hidden);

  }catch{} }

}
function drawFight(){
  const f=S.fight;
  rect(0,0,W,H,'#333b57');rect(0,40,W,26,'#5f5974');rect(0,66,W,33,'#996b7b');rect(0,99,W,40,'#c78a88');rect(0,139,W,37,'#e7b28e');
  // Sunset, clouds and layered rooftops.
  rect(284,65,25,25,'#e8b99c');rect(279,71,35,13,'#e8b99c');for(let i=0;i<7;i++){const x=(i*69+S.clock*1.5)%430-40,y=53+(i%3)*19;rect(x,y,36,2,'#aa8390');rect(x+8,y-2,20,2,'#aa8390');}
  for(let i=0;i<15;i++){const x=i*29-5,y=94+(i*17%39);rect(x,y,23,76,'#776a83');rect(x+3,y-3,4,4,'#776a83');for(let j=0;j<3;j++)rect(x+5+j*6,y+9,2,4,'#be9390');}
  for(let i=0;i<9;i++){const x=i*49-10,y=119+(i*11%32);rect(x,y,40,61,'#424f69');rect(x+3,y,34,2,'#667088');for(let k=0;k<3;k++)for(let j=0;j<3;j++)rect(x+7+j*10,y+8+k*12,4,6,(i+j+k)%3?'#647587':'#dbb495');}
  rect(0,163,W,7,'#8c8a95');rect(0,170,W,13,'#3a435b');for(let x=0;x<W;x+=24){rect(x,173,21,1,'#596379');rect(x+23,170,1,13,'#29364f');}
  // Lantern string and rooftop props.
  for(let i=0;i<12;i++){const x=i*35,y=78+Math.round(Math.sin(i/3)*9);rect(x,y,36,1,'#293c55');rect(x+17,y+1,1,6,'#293c55');rect(x+13,y+7,9,9,'#bd777d');rect(x+14,y+8,7,7,'#f4c08d');rect(x+16,y+8,2,7,'#ffe2aa');rect(x+15,y+16,5,1,'#684f68');}
  panel(20,108,51,24,'#263b51');text('AFTER',45,118,'#ffcea0',7,'center');text('HOURS',45,127,'#91d5c1',7,'center');rect(29,132,2,31,'#34445c');rect(62,132,2,31,'#34445c');plant(355,178);rect(11,146,16,31,'#485769');rect(13,149,12,2,'#829195');rect(13,154,12,2,'#829195');rect(13,159,12,2,'#829195');
  rect(0,183,W,41,'#657987');rect(0,183,W,3,'#a5b3ae');for(let y=192;y<H;y+=14){rect(0,y,W,1,'#41556c');for(let x=(y%2)*20;x<W;x+=40){rect(x,y-9,1,9,'#52667a');rect(x+2,y-8,24,1,'#718591');}}rect(0,215,W,9,'#34475e');
  if(!f){
    const p=fighter(192,S.look);p.facing=1;drawFighter(p);
    panel(79,54,226,25,'#203247');text('Looking for a rival…',192,70,'#ffe0a0',10,'center');
    for(let i=0;i<3;i++)rect(182+i*9,88+Math.sin(S.clock*4-i)*2,3,3,'#a5e0c2');return;
  }
  for(const p of [f.rival,f.me].sort((a,b)=>a.x-b.x))drawFighter(p);
  for(const p of S.fx){rect(p.x,p.y,p.size,p.size,p.color);if(p.size===2)rect(p.x-2,p.y,6,1,p.color);}
  // Clear HUD above the action.
  panel(8,6,157,28,'#202d44');panel(219,6,157,28,'#202d44');
  const left=f.side===0?f.me:f.rival,right=f.side===0?f.rival:f.me;const leftName=f.side===0?S.name:f.rivalName,rightName=f.side===0?f.rivalName:S.name;
  text(leftName.slice(0,18),14,16,'#f5dfbd',8);text(rightName.slice(0,18),370,16,'#f5dfbd',8,'right');rect(13,21,146,8,'#17243a');rect(225,21,146,8,'#17243a');
  rect(14,22,Math.round(144*left.hp/100),6,left.hp<30?'#f09580':'#90d7b1');rect(370-Math.round(144*right.hp/100),22,Math.round(144*right.hp/100),6,right.hp<30?'#f09580':'#90d7b1');rect(14,22,Math.round(144*left.hp/100),2,'#c7e8bf');rect(370-Math.round(144*right.hp/100),22,Math.round(144*right.hp/100),2,'#c7e8bf');
  panel(171,6,42,28,'#25334b');text(String(Math.ceil(f.timer)).padStart(2,'0'),192,24,'#ffe2a3',16,'center');text('BEST OF 3',192,44,'#ffe1a3',7,'center');
  for(let i=0;i<2;i++){rect(13+i*10,38,6,5,f.score[0]>i?'#ffcf8a':'#4a586d');rect(366-i*10,38,6,5,f.score[1]>i?'#ffcf8a':'#4a586d');}
  text('YOU',f.me.x,200,'#ffe0a0',7,'center');text(f.cpu?'CPU':'RIVAL',f.rival.x,200,'#bce0d7',7,'center');
  if(f.countdown>0){panel(132,91,120,32,'#203247');text(f.message,192,104,'#ffe0a0',9,'center');text(f.countdown>.6?'READY?':'FIGHT!',192,116,'#a5e0c2',8,'center');}
  if(f.phase==='between'||f.phase==='finished'){panel(104,72,176,30,'#203247');text(f.message,192,91,'#ffe0a0',15,'center');}

}
function render(){
  g.save();g.clearRect(0,0,W,H);if(S.shake>0)g.translate(Math.round((Math.random()-.5)*S.shake*2),Math.round((Math.random()-.5)*S.shake));
  drawFight();g.restore();const f=S.fight;$('focusNote').hidden=S.focused||!f;$('focusNote').textContent=f?.cpu?"Paused — you're in the chat. Click to play.":"You're in the chat — click to play";
}
function loop(now){const dt=clamp((now-last)/1000,0,.05);last=now;S.frames++;try{update(dt);render();}catch(err){S.errors++;if(S.errors<=3)console.error('Arena frame',err);}requestAnimationFrame(loop);}
canvas.addEventListener('pointerdown',e=>{focus();if(S.scene==='fight'){mouseDown=true;press();canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener('pointerup',()=>{if(mouseDown)release();mouseDown=false;});canvas.addEventListener('pointercancel',clearInput);
addEventListener('keydown',e=>{
  if(e.key==='Escape'){clearInput();S.focused=false;return;}
  if(!S.focused||e.repeat)return;
  if(!soundStarted){soundStarted=true;S.muted=false;sfx('start');}
  if(e.key.toLowerCase()==='m'){S.muted=!S.muted;if(!S.muted)sfx('start');return;}
  if(e.code==='Space'&&S.scene==='fight'){e.preventDefault();press();}
  else if(e.key.startsWith('Arrow')){e.preventDefault();keys.add(e.key);}
});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.code==='Space')release();});
addEventListener('blur',()=>{S.focused=false;clearInput();});addEventListener('focus',()=>{S.focused=true;});document.addEventListener('visibilitychange',()=>{clearInput();if(document.hidden)S.focused=false;else S.focused=document.hasFocus();});
window.arena={snapshot:()=>({scene:S.scene,online:S.online,id:S.id,name:S.name,look:S.look,record:{...S.record},frames:S.frames,errors:S.errors,focused:S.focused,held,queue:!!S.queueUntil,fight:S.fight?{cpu:S.fight.cpu,round:S.fight.round,phase:S.fight.phase,side:S.fight.side,score:[...S.fight.score],me:{x:S.fight.me.x,hp:S.fight.me.hp,action:S.fight.me.action,charge:S.fight.me.charge},rival:{x:S.fight.rival.x,hp:S.fight.rival.hp,action:S.fight.rival.action},timer:S.fight.timer,countdown:S.fight.countdown}:null})};
syncUI();requestAnimationFrame(loop);bridge.send({type:'ready'});
</script></body></html>
